<h2 mat-dialog-title>Enregistrer un paiement</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="dialog-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Mois concerné (YYYY-MM)</mat-label>
      <input matInput formControlName="moisConcerne" placeholder="2026-03">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Date de paiement</mat-label>
      <input matInput type="date" formControlName="datePaiement">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Montant (FCFA)</mat-label>
      <input matInput type="number" formControlName="montant">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Moyen de paiement</mat-label>
      <mat-select formControlName="moyenPaiement">
        @for (m of moyens; track m) {
          <mat-option [value]="m">{{ m }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Référence (optionnel)</mat-label>
      <input matInput formControlName="referencePaiement">
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Annuler</button>
  <button mat-raised-button color="primary" (click)="submit()" [disabled]="form.invalid">
    Enregistrer
  </button>
</mat-dialog-actions>
