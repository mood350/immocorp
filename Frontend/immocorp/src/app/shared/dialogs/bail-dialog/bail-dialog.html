<h2 mat-dialog-title>{{ data ? 'Modifier' : 'Créer' }} un bail</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="dialog-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Propriété</mat-label>
      <mat-select formControlName="proprieteId">
        @for (p of proprietes(); track p.id) {
          <mat-option [value]="p.id">{{ p.adresse }} — {{ p.ville }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Locataire</mat-label>
      <mat-select formControlName="locataireId">
        @for (l of locataires(); track l.id) {
          <mat-option [value]="l.id">{{ l.prenom }} {{ l.nom }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <div class="two-col">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Date début</mat-label>
        <input matInput type="date" formControlName="dateDebut">
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Date fin (optionnel)</mat-label>
        <input matInput type="date" formControlName="dateFin">
      </mat-form-field>
    </div>

    <div class="two-col">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Loyer mensuel (FCFA)</mat-label>
        <input matInput type="number" formControlName="montantLoyer">
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Jour d'échéance</mat-label>
        <input matInput type="number" formControlName="jourEcheance" placeholder="5">
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Annuler</button>
  <button mat-raised-button color="primary" (click)="submit()" [disabled]="form.invalid">
    {{ data ? 'Modifier' : 'Créer' }}
  </button>
</mat-dialog-actions>
