<h2 mat-dialog-title>{{ data ? 'Modifier' : 'Ajouter' }} une propriété</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="dialog-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Type</mat-label>
      <mat-select formControlName="type">
        @for (t of types; track t) {
          <mat-option [value]="t">{{ t }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Adresse</mat-label>
      <input matInput formControlName="adresse">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Ville</mat-label>
      <input matInput formControlName="ville">
    </mat-form-field>

    <div class="two-col">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Superficie (m²)</mat-label>
        <input matInput type="number" formControlName="superficie">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Loyer (FCFA)</mat-label>
        <input matInput type="number" formControlName="loyer">
      </mat-form-field>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Annuler</button>
  <button mat-raised-button color="primary" (click)="submit()" [disabled]="form.invalid">
    {{ data ? 'Modifier' : 'Ajouter' }}
  </button>
</mat-dialog-actions>
