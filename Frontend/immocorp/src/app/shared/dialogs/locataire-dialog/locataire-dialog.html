<h2 mat-dialog-title>{{ data ? 'Modifier' : 'Ajouter' }} un locataire</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="dialog-form">
    <div class="two-col">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nom</mat-label>
        <input matInput formControlName="nom">
      </mat-form-field>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Prénom</mat-label>
        <input matInput formControlName="prenom">
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Téléphone</mat-label>
      <input matInput formControlName="telephone">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Pièce d'identité</mat-label>
      <input matInput formControlName="pieceIdentite">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Date d'entrée</mat-label>
      <input matInput type="date" formControlName="dateEntree">
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Annuler</button>
  <button mat-raised-button color="primary" (click)="submit()" [disabled]="form.invalid">
    {{ data ? 'Modifier' : 'Ajouter' }}
  </button>
</mat-dialog-actions>
