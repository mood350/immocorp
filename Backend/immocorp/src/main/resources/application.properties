spring.application.name=immocorp
server.port=8080

# Base de données
spring.datasource.url=jdbc:postgresql://localhost:5432/immocorp
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Mail
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASS}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Twilio
twilio.account.sid=${TWILIO_SID}
twilio.auth.token=${TWILIO_TOKEN}
twilio.phone.number=${TWILIO_PHONE}
twilio.phone.destinataire=${TWILIO_DESTINATAIRE}

# FedaPay
fedapay.api.key=${FEDAPAY_KEY}
fedapay.api.url=${FEDAPAY_URL}
fedapay.callback.url=${FEDAPAY_CALLBACK}

# Logs
logging.level.com.immocorp=DEBUG
logging.level.org.springframework.mail=DEBUG

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000
# Upload
app.upload.quittances-dir=./uploads/quittances/